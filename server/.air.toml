root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
delay = 200
exclude_dir = ["tmp", "vendor"]
exclude_file = []
exclude_regex = ["_test\\.go"]
exclude_unchanged = false
follow_symlink = false
full_bin = "bash -lc 'if [ -f ./.env ]; then while IFS= read -r line || [ -n \"$line\" ]; do case \"$line\" in \"\"|\\#*) continue ;; *) export \"$line\" ;; esac; done < ./.env; fi; exec ./tmp/api'"
include_dir = ["cmd", "internal"]
include_ext = ["go", "tpl", "tmpl", "html", "env"]
kill_delay = "0s"
log = "build-errors.log"
poll = false
poll_interval = 0
post_cmd = []
pre_cmd = []
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_error = true

[color]
app = "yellow"
build = "cyan"
main = "magenta"
runner = "green"
watcher = "blue"

[log]
main_only = false
silent = false
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
